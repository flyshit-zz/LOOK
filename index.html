<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI 旅行助手</title>
    <!-- 使用 marked 渲染 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f4f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ---------- 主容器 ---------- */
        .app {
            width: 100%;
            max-width: 820px;
            height: 95vh;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ---------- 头部 ---------- */
        .header {
            padding: 20px 28px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-weight: 500;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }
        .header .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 400;
        }
        /* ---------- 消息区域 ---------- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafcff;
        }
        /* 消息气泡 */
        .msg {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeUp 0.25s ease-out;
        }
        .msg.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #e9edf4;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }
        /* 行程消息更宽，方便阅读表格和长内容 */
        .msg.assistant:has(h1) {
            max-width: 92%;
        }
        /* ── 标题层级 ─────────────────────────── */
        .msg.assistant h1 {
            font-size: 1.35rem;
            margin: 0.2em 0 0.6em;
            padding-bottom: 0.35em;
            border-bottom: 2px solid #1a73e8;
            color: #1e293b;
        }
        .msg.assistant h2 {
            font-size: 1.15rem;
            margin: 1em 0 0.4em;
            color: #1557b0;
        }
        .msg.assistant h3 {
            font-size: 1rem;
            margin: 0.7em 0 0.2em;
            color: #334155;
        }

        /* ── 表格（概览 / 景点 / 费用） ────────── */
        .msg.assistant table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5em 0 0.9em;
            font-size: 0.86rem;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
        }
        .msg.assistant th {
            background: #e8f0fe;
            color: #1557b0;
            font-weight: 600;
            padding: 7px 10px;
            text-align: left;
            white-space: nowrap;
        }
        .msg.assistant td {
            padding: 6px 10px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .msg.assistant tr:last-child td { border-bottom: none; }

        /* ── 引用块（贴士 / 推荐理由） ────────── */
        .msg.assistant blockquote {
            border-left: 3px solid #1a73e8;
            margin: 0.5em 0;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            color: #475569;
            font-size: 0.9rem;
        }
        .msg.assistant blockquote p { margin: 0; }

        /* ── 行内代码（兴趣标签） ─────────────── */
        .msg.assistant code {
            background: #e8f0fe;
            color: #1557b0;
            padding: 1px 7px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: inherit;
        }

        /* ── 水平分隔线 ───────────────────────── */
        .msg.assistant hr {
            border: none;
            border-top: 1px dashed #cbd5e1;
            margin: 1em 0;
        }

        /* ── 列表 ─────────────────────────────── */
        .msg.assistant ul,
        .msg.assistant ol {
            padding-left: 1.5em;
            margin: 0.4em 0;
        }
        .msg.assistant li {
            margin-bottom: 4px;
        }

        /* ── 粗体强调 ─────────────────────────── */
        .msg.assistant strong { color: #1e293b; }

        /* ── 段落间距 ─────────────────────────── */
        .msg.assistant p { margin: 0.3em 0; }

        /* ── 景点操作按钮 ─────────────────────── */
        .attr-btn-group {
            display: inline-flex;
            gap: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .attr-btn {
            display: inline-block;
            padding: 2px 10px;
            border: 1px solid;
            border-radius: 14px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
            white-space: nowrap;
            font-weight: 500;
            line-height: 1.5;
        }
        .attr-btn.preview {
            color: #1557b0;
            border-color: #a8c8fa;
            background: #e8f0fe;
        }
        .attr-btn.preview:hover {
            background: #d2e3fc;
            border-color: #7baaf7;
        }
        .attr-btn.ticket {
            color: #b45309;
            border-color: #fcd34d;
            background: #fffbeb;
        }
        .attr-btn.ticket:hover {
            background: #fef3c7;
            border-color: #fbbf24;
        }
        .msg .loading-dots::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* ---------- 输入区域 ---------- */
        .input-area {
            padding: 16px 28px 24px;
            background: white;
            border-top: 1px solid #e9edf4;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid #dde3ed;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            background: #f8faff;
        }
        .input-area input:focus {
            border-color: #1a73e8;
            background: white;
        }
        .input-area input::placeholder {
            color: #9aa6b5;
        }
        .input-area button {
            padding: 12px 28px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .input-area button:hover {
            background: #1557b0;
        }
        .input-area button:active {
            transform: scale(0.96);
        }
        .input-area button:disabled {
            background: #9aa6b5;
            cursor: not-allowed;
        }
        /* ── 响应式 ──────────────────────────── */
        @media (max-width: 600px) {
            .app {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            .header {
                padding: 16px 20px;
            }
            .messages {
                padding: 16px 18px 8px;
            }
            .input-area {
                padding: 12px 16px 20px;
                flex-wrap: wrap;
            }
            .input-area input {
                flex: 1 1 100%;
            }
            .input-area button {
                width: 100%;
                justify-content: center;
            }
            .msg {
                max-width: 92%;
                font-size: 0.9rem;
                padding: 12px 16px;
            }
            /* 移动端表格横向滚动 */
            .msg.assistant table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        /* ── 打印样式 ────────────────────────── */
        @media print {
            body {
                background: white !important;
                height: auto !important;
            }
            .app {
                max-width: 100% !important;
                height: auto !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            .header {
                background: #0d47a1 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .input-area { display: none !important; }
            .messages {
                overflow-y: visible !important;
                padding: 16px 20px !important;
                background: white !important;
            }
            .msg {
                max-width: 100% !important;
                page-break-inside: avoid;
            }
            .msg.assistant {
                background: white !important;
                border: 1px solid #e2e8f0;
                padding: 18px 22px !important;
            }
            .msg.user { display: none !important; }
            .msg.assistant h2 { page-break-after: avoid; }
        }
        /* ---------- 滚动条 ---------- */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: #f0f4f8;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ── 图片预览弹窗 ─────────────────────── */
        .photo-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .photo-modal-overlay.active {
            display: flex;
        }
        .photo-modal {
            background: white;
            border-radius: 18px;
            max-width: 720px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0,0,0,0.25);
            position: relative;
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .photo-modal-header {
            padding: 18px 22px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            background: white;
            border-radius: 18px 18px 0 0;
            z-index: 2;
        }
        .photo-modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }
        .photo-modal-header .poi-addr {
            font-size: 0.82rem;
            color: #64748b;
            font-weight: 400;
            margin-left: 8px;
        }
        .photo-modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f1f5f9;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .photo-modal-close:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .photo-modal-body {
            padding: 18px 22px 22px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .photo-grid img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s;
            background: #f1f5f9;
        }
        .photo-grid img:hover {
            transform: scale(1.03);
        }
        .photo-grid .photo-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .photo-static-map {
            margin-top: 16px;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }
        .photo-static-map h4 {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0 0 10px;
            font-weight: 500;
        }
        .photo-static-map img {
            width: 100%;
            border-radius: 10px;
        }
        /* 弹窗加载 spinner */
        .photo-modal-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        .photo-modal-spinner .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 移动端弹窗 */
        @media (max-width: 600px) {
            .photo-modal-overlay {
                padding: 0;
                align-items: flex-end;
            }
            .photo-modal {
                max-width: 100%;
                max-height: 92vh;
                border-radius: 18px 18px 0 0;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ 图片预览弹窗 ═══ -->
    <div class="photo-modal-overlay" id="photoModalOverlay">
        <div class="photo-modal">
            <div class="photo-modal-header">
                <h3 id="photoModalTitle">景点图片</h3>
                <button class="photo-modal-close" id="photoModalClose">&times;</button>
            </div>
            <div class="photo-modal-body" id="photoModalBody">
                <div class="photo-modal-spinner"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <h1>✈️ 旅行助手</h1>
            <span class="badge">AI · 多智能体</span>
        </header>

        <!-- 消息列表 -->
        <div class="messages" id="messageContainer">
            <!-- 欢迎消息由 JS 动态插入 -->
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="输入目的地和天数，例如：帮我规划北京3日游，喜欢历史文化"
                autocomplete="off"
            />
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const msgContainer = document.getElementById('messageContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');

            // ---------- 会话状态 ----------
            // 生成一个简单的 session_id（也可从后端获取，此处前端维护）
            let sessionId = localStorage.getItem('travel_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('travel_session_id', sessionId);
            }

            // ---------- 行程数据（从后端响应保存，供按钮使用） ----------
            let lastDestination = '';
            let lastAttractions = [];

            // ---------- API 配置 ----------
            // 自动检测：如果页面从 FastAPI 服务打开，用同源；否则用 localhost:8000
            const API_BASE = window.location.origin.startsWith('http')
                ? window.location.origin
                : 'http://localhost:8000';
            console.log('API_BASE:', API_BASE);

            // ---------- 弹窗 DOM 引用 ----------
            const photoModalOverlay = document.getElementById('photoModalOverlay');
            const photoModalTitle   = document.getElementById('photoModalTitle');
            const photoModalBody    = document.getElementById('photoModalBody');
            const photoModalCloseBtn = document.getElementById('photoModalClose');

            // ---------- 关闭弹窗 ----------
            function closePhotoModal() {
                photoModalOverlay.classList.remove('active');
            }
            photoModalCloseBtn.addEventListener('click', closePhotoModal);
            photoModalOverlay.addEventListener('click', function(e) {
                if (e.target === photoModalOverlay) closePhotoModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && photoModalOverlay.classList.contains('active')) {
                    closePhotoModal();
                }
            });

            // ---------- 打开弹窗 & 加载图片 ----------
            async function openPhotoModal(attrName) {
                // 显示弹窗（加载态）
                photoModalOverlay.classList.add('active');
                photoModalTitle.innerHTML = `${attrName}<span class="poi-addr"></span>`;
                photoModalBody.innerHTML = '<div class="photo-modal-spinner"><div class="spinner"></div></div>';

                // ── 在后端 attractions 数据中按名称模糊匹配 POI ID ──
                const match = findAttractionByName(attrName);

                try {
                    // 优先用 POI ID 精确查；否则用名称+城市搜索
                    let apiUrl;
                    if (match && match.id) {
                        apiUrl = `${API_BASE}/api/poi/photos?name=${encodeURIComponent(match.name)}&city=${encodeURIComponent(lastDestination)}`;
                    } else {
                        apiUrl = `${API_BASE}/api/poi/photos?name=${encodeURIComponent(attrName)}&city=${encodeURIComponent(lastDestination)}`;
                    }

                    const resp = await fetch(apiUrl);
                    if (!resp.ok) throw new Error(`API 返回 ${resp.status}`);
                    const data = await resp.json();

                    renderPhotoModal(attrName, data);
                } catch (err) {
                    console.error('加载图片失败:', err);
                    photoModalBody.innerHTML = `
                        <div class="photo-empty">
                            ⚠️ 图片加载失败: ${err.message}<br>
                            <small>请检查网络连接或稍后重试</small>
                        </div>`;
                }
            }

            // ── 模糊匹配景点名称 ──
            function findAttractionByName(name) {
                if (!lastAttractions.length) return null;
                // 精确匹配
                let match = lastAttractions.find(a => a.name === name);
                if (match) return match;
                // 包含匹配
                match = lastAttractions.find(a =>
                    a.name.includes(name) || name.includes(a.name)
                );
                if (match) return match;
                // 取第一个（兜底）
                return lastAttractions[0];
            }

            // ── 渲染弹窗内容 ──
            function renderPhotoModal(attrName, data) {
                const addr = data.poi_address || '';
                photoModalTitle.innerHTML = `${data.poi_name || attrName}` +
                    (addr ? `<span class="poi-addr">📍 ${addr}</span>` : '');

                const photos = data.photos || [];
                const staticMapUrl = data.static_map_url || '';

                let html = '';

                // 图片网格
                if (photos.length > 0) {
                    html += '<div class="photo-grid">';
                    photos.forEach(p => {
                        const url = p.url || '';
                        const title = p.title || data.poi_name || '';
                        if (url) {
                            // 高德图片 URL 可能需要 HTTPS
                            const imgUrl = url.replace(/^http:\/\//, 'https://');
                            html += `<img src="${imgUrl}" alt="${title}" title="${title}" loading="lazy" onerror="this.style.display='none'">`;
                        }
                    });
                    html += '</div>';
                } else {
                    html += '<div class="photo-empty">📷 暂无景点图片</div>';
                }

                // 静态地图（兜底 + 补充）
                if (staticMapUrl) {
                    html += `
                        <div class="photo-static-map">
                            <h4>🗺️ 地图位置</h4>
                            <img src="${staticMapUrl}" alt="地图" loading="lazy">
                        </div>`;
                }

                photoModalBody.innerHTML = html;
            }

            // ---------- 辅助：从景点文本中提取景点名称 ----------
            function extractAttractionName(text) {
                // 去掉开头的 "景点N：" 或 "景点N:"
                let name = text.replace(/^景点\d+\s*[：:]\s*/, '');
                // 去掉 Markdown 粗体标记 **xxx**
                name = name.replace(/\*\*(.+?)\*\*/g, '$1');
                // 截取到 "—" 或 "，" 或 "：" 之前作为景点名
                const sep = name.indexOf('—');
                if (sep > 0) { name = name.substring(0, sep); }
                return name.trim();
            }

            // ---------- 辅助：为景点列表项添加操作按钮 ----------
            function injectAttractionButtons(container) {
                // 找到所有包含 🎯 的 <li> 元素
                const allLis = container.querySelectorAll('li');
                allLis.forEach(li => {
                    if (li.textContent.includes('🎯') && !li.querySelector('.attr-btn-group')) {
                        const attrName = extractAttractionName(li.textContent);
                        if (!attrName) return;

                        const btnGroup = document.createElement('span');
                        btnGroup.className = 'attr-btn-group';

                        // 预览图按钮 —— 调用后端高德 API，弹窗展示
                        const previewBtn = document.createElement('button');
                        previewBtn.className = 'attr-btn preview';
                        previewBtn.textContent = '🖼 预览图';
                        previewBtn.title = `查看 ${attrName} 的实拍图片`;
                        previewBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            openPhotoModal(attrName);
                        });

                        // 买票按钮
                        const ticketBtn = document.createElement('a');
                        ticketBtn.className = 'attr-btn ticket';
                        ticketBtn.textContent = '🎫 买票';
                        ticketBtn.title = `购买 ${attrName} 门票`;
                        ticketBtn.href = `https://ctrip.com/search?keyword=${encodeURIComponent(attrName + ' 门票')}`;
                        ticketBtn.target = '_blank';
                        ticketBtn.rel = 'noopener';

                        btnGroup.appendChild(previewBtn);
                        btnGroup.appendChild(ticketBtn);
                        li.appendChild(btnGroup);
                    }
                });
            }

            // ---------- 辅助：添加消息到界面 ----------
            function addMessage(role, content) {
                const div = document.createElement('div');
                div.className = `msg ${role}`;
                if (role === 'assistant') {
                    // 使用 marked 渲染 Markdown
                    div.innerHTML = marked.parse(content);
                    // 为景点条目注入预览图 / 买票按钮
                    injectAttractionButtons(div);
                } else {
                    div.textContent = content;
                }
                msgContainer.appendChild(div);
                // 滚动到底部
                msgContainer.scrollTop = msgContainer.scrollHeight;
                return div;
            }

            // 添加加载中消息
            let loadingMsg = null;
            function showLoading() {
                if (loadingMsg) return;
                const div = document.createElement('div');
                div.className = 'msg assistant';
                div.innerHTML = '<span class="loading-dots">🤔 思考中</span>';
                msgContainer.appendChild(div);
                loadingMsg = div;
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }
            function hideLoading() {
                if (loadingMsg) {
                    loadingMsg.remove();
                    loadingMsg = null;
                }
            }

            // ---------- 发送消息 ----------
            async function sendMessage() {
                const query = userInput.value.trim();
                if (!query) return;

                // 清空输入
                userInput.value = '';
                // 禁用按钮
                sendBtn.disabled = true;
                userInput.disabled = true;

                // 显示用户消息
                addMessage('user', query);

                // 显示加载
                showLoading();

                try {
                    const response = await fetch(`${API_BASE}/plan`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            session_id: sessionId,
                        }),
                    });

                    hideLoading();

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`后端错误 (${response.status}): ${errText}`);
                    }

                    const data = await response.json();
                    console.log('后端响应:', data);

                    // ── 保存行程数据（供按钮使用） ──
                    if (data.destination) lastDestination = data.destination;
                    if (data.attractions && data.attractions.length > 0) {
                        lastAttractions = data.attractions;
                    }

                    // 处理响应
                    let reply = '';
                    if (data.success === false) {
                        reply = `❌ 出错了: ${data.error || '未知错误'}`;
                    } else if (data.itinerary) {
                        reply = data.itinerary;
                        // 如果行程是 Markdown，直接渲染
                    } else {
                        reply = '收到请求，但未能生成行程。请重试。';
                    }

                    addMessage('assistant', reply);

                    // 如果后端返回了更新后的 session_id（可选），可更新
                    if (data.session_id) {
                        sessionId = data.session_id;
                        localStorage.setItem('travel_session_id', sessionId);
                    }

                } catch (error) {
                    hideLoading();
                    console.error('请求失败:', error);
                    addMessage('assistant', `⚠️ 请求失败: ${error.message || '网络错误，请检查后端服务是否运行。'}`);
                } finally {
                    // 恢复按钮
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();
                }
            }

            // ---------- 事件绑定 ----------
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ---------- 初始化欢迎消息 ----------
            function initWelcome() {
                const welcome = [
                    '# 🌍 欢迎使用 AI 旅行助手',
                    '',
                    '我可以帮你规划旅行行程。你只需告诉我：',
                    '- **目的地**（例如：北京、上海）',
                    '- **旅行天数**（例如：3 天）',
                    '- **偏好**（可选，例如：历史文化、美食、自然风光）',
                    '',
                    '我会自动搜索景点、酒店、餐厅，为你生成合理的每日行程。',
                    '',
                    '**💡 试试输入**：*帮我规划北京3日游*',
                ].join('\n');
                addMessage('assistant', welcome);
            }

            initWelcome();

            // 调整输入框焦点
            userInput.focus();

        })();
    </script>
</body>
</html>
